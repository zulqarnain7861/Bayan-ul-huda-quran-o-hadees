name: Bayan al-Huda Android CI & Security Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GRADLE_REQUIRED_VERSION: "9.3.1"

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Ensure Gradle 9.3.1 & Android SDK 36 / 36.1
        run: |
          set -euo pipefail
          CURRENT_GRADLE_VER="$(gradle --version 2>/dev/null | awk '/^Gradle / {print $2}' || true)"
          if [[ "${CURRENT_GRADLE_VER}" != "${GRADLE_REQUIRED_VERSION}" ]]; then
            GRADLE_ZIP="${RUNNER_TEMP}/gradle-${GRADLE_REQUIRED_VERSION}-bin.zip"
            curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_REQUIRED_VERSION}-bin.zip" -o "${GRADLE_ZIP}"
            unzip -q -o "${GRADLE_ZIP}" -d "${RUNNER_TEMP}"
            echo "${RUNNER_TEMP}/gradle-${GRADLE_REQUIRED_VERSION}/bin" >> "${GITHUB_PATH}"
            export PATH="${RUNNER_TEMP}/gradle-${GRADLE_REQUIRED_VERSION}/bin:${PATH}"
          fi

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="${SDK_ROOT}"
          export ANDROID_SDK_ROOT="${SDK_ROOT}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"

          SDKMANAGER_BIN="$(find "${SDK_ROOT}" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          if [[ -z "${SDKMANAGER_BIN}" ]] && command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER_BIN="$(command -v sdkmanager)"
          fi
          if [[ -n "${SDKMANAGER_BIN}" ]]; then
            yes | "${SDKMANAGER_BIN}" --licenses >/dev/null 2>&1 || true
            "${SDKMANAGER_BIN}" "platform-tools" >/dev/null 2>&1 || true
            "${SDKMANAGER_BIN}" "platforms;android-36" >/dev/null 2>&1 || true
            "${SDKMANAGER_BIN}" "platforms;android-36.1" >/dev/null 2>&1 || true
            "${SDKMANAGER_BIN}" "build-tools;36.0.0" >/dev/null 2>&1 || "${SDKMANAGER_BIN}" "build-tools;35.0.0" >/dev/null 2>&1 || true
          fi

      - name: Prepare clean-build signing & verify .env.example
        run: |
          chmod +x tools/signing/prepare-clean-build-signing.sh
          ./tools/signing/prepare-clean-build-signing.sh

      - name: Run Clean-Build Config Check & Unit/Robolectric Verification Suite
        run: |
          if [ -x "./gradlew" ]; then
            ./gradlew verifyCleanBuildConfig :app:testDebugUnitTest --tests "com.example.GitHubUpdaterAndReleaseAutomationTest" --tests "com.example.SecurityAndQualityTicketVerificationTest" --tests "com.example.LearnIslamAndUpgradeVerificationTest" --tests "com.example.SehriIftarAndAboutVerificationTest" :app:assembleDebug --stacktrace
          else
            gradle verifyCleanBuildConfig :app:testDebugUnitTest --tests "com.example.GitHubUpdaterAndReleaseAutomationTest" --tests "com.example.SecurityAndQualityTicketVerificationTest" --tests "com.example.LearnIslamAndUpgradeVerificationTest" --tests "com.example.SehriIftarAndAboutVerificationTest" :app:assembleDebug --stacktrace
          fi

  firestore-rules-test:
    name: firestore-rules-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Firestore Zero-Trust Security Rules & Proxy Configuration
        run: |
          set -euo pipefail
          if [ -f "firestore.rules" ]; then
            grep -q "rules_version = '2';" firestore.rules
            grep -q "request.auth != null" firestore.rules
            echo "firestore.rules verified."
          fi
          test -f "tools/proxy/hadith-api-proxy.js"
          echo "Server-side proxy configuration verified."
